# Builds every push and pull request, so a broken build shows up before a release.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build mk.dev.runner.sln -c Release

      - name: Test
        run: dotnet test tests/mk.dev.runner.tests -c Release --no-build
